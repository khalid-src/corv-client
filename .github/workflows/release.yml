name: release

# Cuts a release automatically when you push a version tag, e.g.:
#   git tag vX.Y.Z
#   git push origin vX.Y.Z
# It cross-compiles every desktop binary, stamps the tag as the version, and
# publishes them on the GitHub release - no manual building or uploading.

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Release notes
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"

      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LD="-s -w -X github.com/khalid-src/corv-client/internal/version.Version=${VERSION}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "$LD" -o dist/corv-windows-amd64.exe ./cmd/corv
          GOOS=linux   GOARCH=amd64 go build -ldflags "$LD" -o dist/corv-linux-amd64       ./cmd/corv
          GOOS=linux   GOARCH=arm64 go build -ldflags "$LD" -o dist/corv-linux-arm64       ./cmd/corv
          GOOS=darwin  GOARCH=amd64 go build -ldflags "$LD" -o dist/corv-darwin-amd64      ./cmd/corv
          GOOS=darwin  GOARCH=arm64 go build -ldflags "$LD" -o dist/corv-darwin-arm64      ./cmd/corv
          (cd dist && sha256sum corv-* > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body_path: docs/releases/${{ github.ref_name }}.md
